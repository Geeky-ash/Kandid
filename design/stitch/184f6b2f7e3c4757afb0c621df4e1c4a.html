<script>
  (function () {
    const canvas = document.getElementById('preview-canvas');
    const imageBefore = document.getElementById('image-before');
    const hintPill = document.getElementById('hint-pill');
    const intensityInput = document.getElementById('intensity-input');
    const intensityValue = document.getElementById('intensity-value');
    const sliderFill = document.getElementById('slider-fill');
    const sliderThumb = document.getElementById('slider-thumb');
    const intensityReset = document.getElementById('intensity-reset');
    const lookButtons = document.querySelectorAll('.look-btn');
    const activeLookTitle = document.getElementById('active-look-title');
    const activeLookSubtitle = document.getElementById('active-look-subtitle');
    const imageAfter = document.getElementById('image-after');

    // Press and hold photo to inspect original
    const startCompare = (e) => {
      e.preventDefault();
      imageBefore.classList.remove('opacity-0');
      imageBefore.classList.add('opacity-100');
      hintPill.classList.add('opacity-0', 'scale-90');
    };

    const stopCompare = () => {
      imageBefore.classList.remove('opacity-100');
      imageBefore.classList.add('opacity-0');
      hintPill.classList.remove('opacity-0', 'scale-90');
    };

    if (canvas) {
      canvas.addEventListener('mousedown', startCompare);
      window.addEventListener('mouseup', stopCompare);
      canvas.addEventListener('touchstart', startCompare, { passive: false });
      window.addEventListener('touchend', stopCompare);
      window.addEventListener('touchcancel', stopCompare);
    }

    // Intensity slider handler
    const updateSlider = (val) => {
      intensityValue.textContent = val + '%';
      sliderFill.style.width = val + '%';
      sliderThumb.style.left = val + '%';
      // Apply visual opacity/warmth shift
      if (imageAfter) {
        const opacityRatio = 0.4 + (val / 100) * 0.6;
        imageAfter.style.filter = 'saturate(' + (0.9 + (val / 100) * 0.3) + ') contrast(' + (0.95 + (val / 100) * 0.1) + ')';
        imageAfter.style.opacity = opacityRatio;
      }
    };

    if (intensityInput) {
      intensityInput.addEventListener('input', (e) => {
        updateSlider(e.target.value);
      });
    }

    if (intensityReset) {
      intensityReset.addEventListener('click', () => {
        intensityInput.value = 100;
        updateSlider(100);
      });
    }

    // Gemstone looks carousel selector
    lookButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.getAttribute('data-name');
        const desc = btn.getAttribute('data-desc');

        activeLookTitle.textContent = name;
        activeLookSubtitle.textContent = desc;

        lookButtons.forEach(b => {
          const wrapper = b.querySelector('div.rounded-2xl');
          const label = b.querySelector('span.font-label-sm');
          const innerIcon = b.querySelector('.relative.z-10');

          wrapper.className = 'w-16 h-16 rounded-2xl p-0.5 bg-surface-container flex items-center justify-center transition-all';
          label.className = 'font-label-sm text-label-sm text-on-surface-variant lowercase';
          if (innerIcon) innerIcon.remove();
        });

        const activeWrapper = btn.querySelector('div.rounded-2xl');
        const activeLabel = btn.querySelector('span.font-label-sm');
        const activeInner = btn.querySelector('div.rounded-\\[14px\\]');

        activeWrapper.className = 'w-16 h-16 rounded-2xl p-0.5 bg-primary-container shadow-md flex items-center justify-center transition-all';
        activeLabel.className = 'font-label-sm text-label-sm text-on-surface font-semibold lowercase';

        // Checkmark badge insertion
        if (!activeInner.querySelector('.material-symbols-outlined.relative')) {
          const check = document.createElement('span');
          check.className = 'material-symbols-outlined text-[18px] text-on-primary-fixed relative z-10';
          check.style.fontVariationSettings = "'FILL' 1";
          check.textContent = 'check_circle';
          activeInner.appendChild(check);
        }
      });
    });
  })();
</script></main></body></html>
