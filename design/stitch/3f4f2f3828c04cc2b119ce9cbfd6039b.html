<script>
  // Camera Interactive Micro-interactions
  (function() {
    const shutterBtn = document.getElementById('shutter-btn');
    const flashEffect = document.getElementById('flash-effect');
    const shutterPulse = document.getElementById('shutter-pulse');
    const flipBtn = document.getElementById('flip-btn');
    const zoomButtons = document.querySelectorAll('.zoom-btn');
    const coachToggle = document.getElementById('coach-toggle');

    // Shutter Trigger Feedback
    if (shutterBtn && flashEffect) {
      shutterBtn.addEventListener('click', () => {
        // Flash simulation
        flashEffect.classList.remove('opacity-0');
        flashEffect.classList.add('opacity-90');
        
        if (shutterPulse) {
          shutterPulse.classList.add('scale-125', 'opacity-100');
        }

        setTimeout(() => {
          flashEffect.classList.remove('opacity-90');
          flashEffect.classList.add('opacity-0');
        }, 120);

        setTimeout(() => {
          if (shutterPulse) {
            shutterPulse.classList.remove('scale-125', 'opacity-100');
          }
        }, 300);
      });
    }

    // Zoom Switcher
    zoomButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        zoomButtons.forEach(b => {
          b.className = 'zoom-btn w-9 h-7 rounded-full flex items-center justify-center font-label-md text-label-md text-surface-container-lowest transition-all hover:bg-surface-container-lowest/20';
        });
        btn.className = 'zoom-btn w-9 h-7 rounded-full flex items-center justify-center font-label-md text-label-md bg-surface-container-lowest text-on-surface font-semibold shadow-xs transition-all';
      });
    });

    // Voice Coach Toggle
    if (coachToggle) {
      let active = true;
      coachToggle.addEventListener('click', () => {
        active = !active;
        const textSpan = coachToggle.querySelector('span:last-child');
        const pingDot = coachToggle.querySelector('span.relative');
        if (textSpan) {
          textSpan.textContent = active ? 'coach on' : 'coach paused';
        }
        if (pingDot) {
          pingDot.style.opacity = active ? '1' : '0.4';
        }
      });
    }

    // Lens Flip Micro-animation
    if (flipBtn) {
      let angle = 0;
      flipBtn.addEventListener('click', () => {
        angle += 180;
        flipBtn.style.transform = `rotate(${angle}deg)`;
      });
    }
  })();
