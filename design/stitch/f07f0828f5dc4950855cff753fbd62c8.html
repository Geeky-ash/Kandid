<script>
    (function initLiveCameraStudio() {
      // Shutter Trigger Delight Interaction
      const shutterBtn = document.getElementById('shutterBtn');
      const matchCounter = document.getElementById('matchCounter');
      
      if (shutterBtn) {
        shutterBtn.addEventListener('click', () => {
          // Tactile flash effect over viewfinder
          const flashDiv = document.createElement('div');
          flashDiv.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300 opacity-90';
          shutterBtn.closest('.relative.w-full').appendChild(flashDiv);
          
          setTimeout(() => {
            flashDiv.style.opacity = '0';
            setTimeout(() => flashDiv.remove(), 300);
          }, 60);

          // Elevate match score on shoot
          if (matchCounter) {
            matchCounter.textContent = '94%';
            matchCounter.classList.add('text-secondary-fixed');
          }
        });
      }

      // Lens pill selection logic
      const lensPills = document.querySelectorAll('.lens-pill');
      lensPills.forEach(pill => {
        pill.addEventListener('click', () => {
          lensPills.forEach(p => {
            p.className = 'lens-pill px-3 py-1 rounded-full font-label-md text-label-md text-surface-bright/80 transition-all hover:text-surface-bright active:scale-95';
            p.innerHTML = p.getAttribute('data-zoom');
          });
          pill.className = 'lens-pill px-3.5 py-1 rounded-full font-label-md text-label-md bg-surface-bright text-primary font-bold shadow-md transition-all active:scale-95 flex items-center gap-1';
          pill.innerHTML = `<span>${pill.getAttribute('data-zoom')}</span><span class="w-1 h-1 rounded-full bg-secondary"></span>`;
        });
      });

      // Grid Overlay Toggle
      const gridBtn = document.getElementById('gridBtn');
      const gridOverlay = document.getElementById('gridOverlay');
      if (gridBtn && gridOverlay) {
        let gridActive = true;
        gridBtn.addEventListener('click', () => {
          gridActive = !gridActive;
          gridOverlay.style.opacity = gridActive ? '0.4' : '0';
          gridBtn.classList.toggle('text-secondary-fixed', gridActive);
          gridBtn.classList.toggle('text-surface-bright', !gridActive);
        });
      }

      // Voice Coach Toggle State
      const voiceCoachBtn = document.getElementById('voiceCoachBtn');
      if (voiceCoachBtn) {
        let micMuted = false;
        voiceCoachBtn.addEventListener('click', () => {
          micMuted = !micMuted;
          const icon = voiceCoachBtn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = micMuted ? 'mic_off' : 'mic';
          }
          voiceCoachBtn.classList.toggle('bg-secondary', !micMuted);
          voiceCoachBtn.classList.toggle('bg-primary-container', micMuted);
        });
      }
    })();
  </script>
